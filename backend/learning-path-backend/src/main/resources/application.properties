spring.application.name=learning-path-backend

# ==========================================
# Database Connection (Supabase PostgreSQL / Local)
# ==========================================

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:learningpath_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================

server.port=${PORT:8080}

# ==========================================
# Python ML Recommendation Microservice
# ==========================================

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}