spring.application.name=learning-path-backend

# ==========================================
# Database Connection (Supabase PostgreSQL / Local H2 Fallback)
# ==========================================

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:learningpath_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server Port
# ==========================================

server.port=${SERVER_PORT:${PORT:8080}}

# ==========================================
# Python ML Recommendation Microservice
# ==========================================

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ==========================================
# Google Gemini AI Integration
# ==========================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout.seconds=${GEMINI_TIMEOUT_SECONDS:10}

# ==========================================
# JWT Security Configuration
# ==========================================

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}