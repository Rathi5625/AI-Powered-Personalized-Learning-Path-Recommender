spring.application.name=learning-path-backend

# ==========================================
# Database Connection (Supabase PostgreSQL / Local H2 Fallback)
# ==========================================

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:learningpath_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server Port
# ==========================================

server.port=${SERVER_PORT:${PORT:8080}}

# ==========================================
# Python ML Recommendation Microservice
# ==========================================

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ==========================================
# Google Gemini AI Integration
# ==========================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout.seconds=${GEMINI_TIMEOUT_SECONDS:10}

# ==========================================
# Recommendation Hybrid Scoring Weights
# ==========================================

recommendation.scoring.rule-weight=${RECOMMENDATION_RULE_WEIGHT:0.70}
recommendation.scoring.ml-weight=${RECOMMENDATION_ML_WEIGHT:0.30}

# ==========================================
# JWT Security Configuration
# ==========================================

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Email & OTP Verification Configuration (Gmail SMTP / Custom SMTP)
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@learnai.com}}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.dev-logging=${OTP_DEV_LOGGING:false}